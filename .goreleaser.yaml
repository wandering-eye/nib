# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: nib

before:
  hooks:
    - go mod tidy

builds:
  - id: nib
    binary: nib
    main: ./cmd/nib
    env:
      - CGO_ENABLED=0
    goos: [darwin, linux]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w
      - -X github.com/wandering-eye/nib.VERSION={{ .Version }}
      - -X github.com/wandering-eye/nib.GIT_COMMIT={{ .FullCommit }}
      - -X github.com/wandering-eye/nib.BUILD_DATE={{ .Date }}

  - id: dstask-import
    binary: dstask-import
    main: ./cmd/dstask-import
    env:
      - CGO_ENABLED=0
    goos: [darwin, linux]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w
      - -X github.com/wandering-eye/nib.VERSION={{ .Version }}
      - -X github.com/wandering-eye/nib.GIT_COMMIT={{ .FullCommit }}
      - -X github.com/wandering-eye/nib.BUILD_DATE={{ .Date }}

archives:
  - ids: [nib, dstask-import]
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

homebrew_casks:
  - name: nib
    binaries: [nib, dstask-import]
    homepage: https://github.com/wandering-eye/nib
    description: Terminal TODO manager with git-based sync and markdown notes per task
    repository:
      owner: wandering-eye
      name: homebrew-tap
      branch: main
    # The binaries are not signed or notarized; without this, Gatekeeper blocks them.
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/nib"]
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/dstask-import"]
          end
